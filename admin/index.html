<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YuuComments 管理后台</title>
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body data-api-base="" data-markdown="true" data-math="true">
    <main class="ya-shell">
      <header>
        <p>YuuComments</p>
        <h1>评论管理</h1>
      </header>

      <nav class="ya-tabs" data-view-tabs></nav>

      <section class="ya-toolbar">
        <form data-token-form>
          <label>
            <span>ADMIN_TOKEN</span>
            <input type="password" name="token" autocomplete="off" />
          </label>
          <button type="submit">保存</button>
        </form>

        <label>
          <span>搜索</span>
          <input type="search" data-search placeholder="昵称、内容或页面路径" />
        </label>

        <div class="ya-filters" data-filters></div>
      </section>

      <p class="ya-feedback" data-feedback></p>
      <section class="ya-grid" data-comments></section>
      <section class="ya-grid" data-reports hidden></section>
      <section class="ya-grid" data-bans hidden></section>
    </main>

    <dialog class="ya-dialog" data-spam-ban-dialog>
      <form method="dialog" data-spam-ban-form>
        <header>
          <div>
            <p>Moderation action / 审核操作</p>
            <h2>Mark spam &amp; ban source</h2>
          </div>
          <button type="button" data-spam-ban-close aria-label="Close">×</button>
        </header>

        <p>
          This will mark the comment as spam and block the selected source from
          submitting new comments.
        </p>

        <fieldset>
          <legend>Ban target / 封禁目标</legend>
          <div class="ya-choice-grid">
            <label class="ya-choice">
              <input type="radio" name="banTarget" value="device" checked />
              <strong>Device fingerprint</strong>
              <span>Recommended. Best for blocking the same browser/device.</span>
            </label>
            <label class="ya-choice">
              <input type="radio" name="banTarget" value="ip" />
              <strong>IP hash</strong>
              <span>May affect users on the same network.</span>
            </label>
            <label class="ya-choice">
              <input type="radio" name="banTarget" value="both" />
              <strong>Both</strong>
              <span>Strongest option for obvious spam/bot abuse.</span>
            </label>
          </div>
        </fieldset>

        <fieldset>
          <legend>Ban reason / 封禁原因</legend>
          <div class="ya-reason-grid">
            <label><input type="radio" name="banReason" value="Spam" checked /> Spam</label>
            <label><input type="radio" name="banReason" value="Ads" /> Ads</label>
            <label><input type="radio" name="banReason" value="Bot" /> Bot</label>
            <label><input type="radio" name="banReason" value="Abuse" /> Abuse</label>
            <label><input type="radio" name="banReason" value="Offensive" /> Offensive</label>
            <label><input type="radio" name="banReason" value="Other" /> Other</label>
          </div>
          <label data-custom-reason hidden>
            <span>Custom reason / 自定义原因</span>
            <input type="text" name="customReason" maxlength="500" />
          </label>
        </fieldset>

        <p class="ya-dialog-feedback" data-spam-ban-feedback></p>
        <footer>
          <button type="button" data-spam-ban-cancel>Cancel</button>
          <button type="submit" class="is-danger">Mark spam &amp; ban</button>
        </footer>
      </form>
    </dialog>
    <script src="./admin.js" defer></script>
  </body>
</html>
